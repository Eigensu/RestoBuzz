name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  backend-unit:
    name: Backend / unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/backend/requirements.txt

      - run: pip install -r requirements.txt

      # No INTEGRATION env var, so the gated integration tests are collected
      # and skipped here, not run against a real DB. See backend-integration.
      - run: pytest --cov=app --cov-report=term-missing --cov-report=xml

      - uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: apps/backend/coverage.xml

  backend-integration:
    name: Backend / integration tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      INTEGRATION: "1"
      MONGODB_URL: mongodb://localhost:27017
      MONGODB_DB_NAME: dishpatch_ci
      REDIS_URL: redis://localhost:6379/0
      # Must match tests/integration/test_webhook.py's SECRET constant: the app
      # skips signature verification entirely when this is unset (see
      # app/routers/webhooks.py:_verify_signature), which would make both the
      # valid- and invalid-signature tests pass for the wrong reason.
      META_WEBHOOK_SECRET: test_secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/backend/requirements.txt

      - run: pip install -r requirements.txt

      - run: pytest tests/integration -v

  frontend:
    name: Frontend / lint, type-check, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm type-check

      - run: pnpm build
