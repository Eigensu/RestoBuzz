<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ subject }}</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }
        .wrapper {
            width: 100%;
            table-layout: fixed;
            background-color: #f8f9fa;
            padding-bottom: 40px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background-color: #ffffff;
            border-radius: 12px;
            overflow: hidden;
            margin-top: 40px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }
        .header {
            background-color: #24422e;
            padding: 30px;
            text-align: center;
        }
        .logo {
            font-size: 24px;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: -0.5px;
            text-decoration: none;
        }
        .content {
            padding: 40px 30px;
        }
        .title {
            font-size: 20px;
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 16px;
        }
        .restaurant-tag {
            display: inline-block;
            background-color: #f1f5f9;
            color: #475569;
            font-size: 12px;
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 100px;
            margin-bottom: 24px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .message {
            font-size: 16px;
            line-height: 1.6;
            color: #4b5563;
            margin-bottom: 32px;
        }
        .cta-container {
            text-align: center;
            margin-top: 32px;
        }
        .button {
            display: inline-block;
            background-color: #24422e;
            color: #ffffff !important;
            padding: 14px 28px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            transition: background-color 0.2s;
        }
        .footer {
            text-align: center;
            padding: 24px;
            font-size: 13px;
            color: #94a3b8;
        }
        .details-box {
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 16px;
            margin: 20px 0;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 14px;
            color: #334155;
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="container">
            <div class="header">
                <a href="{{ dashboard_url }}" class="logo">Dishpatch</a>
            </div>
            <div class="content">
                <div class="restaurant-tag">{{ restaurant_name }}</div>
                <h1 class="title">{% block title %}{% endblock %}</h1>
                <div class="message">
                    {% block content %}{% endblock %}
                </div>
                {% if cta_url %}
                <div class="cta-container">
                    <a href="{{ cta_url }}" class="button">{% block cta_text %}Open Dashboard{% endblock %}</a>
                </div>
                {% endif %}
            </div>
        </div>
        <div class="footer">
            &copy; {{ now.year }} Dishpatch Operational Alerts. This is a system-generated message.
        </div>
    </div>
</body>
</html>
